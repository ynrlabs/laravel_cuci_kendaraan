version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: cucikuy_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./public:/var/www/html/public
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - php
    networks:
      - cucikuy_network

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cucikuy_php
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    depends_on:
      - mysql
      - redis
    networks:
      - cucikuy_network
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=cucikuy
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  mysql:
    image: mysql:8.0
    container_name: cucikuy_mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: cucikuy
      MYSQL_USER: cucikuy
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - cucikuy_network
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7-alpine
    container_name: cucikuy_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - cucikuy_network

  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cucikuy_reverb
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    volumes:
      - .:/var/www/html
    ports:
      - "8080:8080"
    depends_on:
      - redis
    networks:
      - cucikuy_network
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  horizon:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cucikuy_horizon
    command: php artisan horizon
    volumes:
      - .:/var/www/html
    depends_on:
      - redis
      - mysql
    networks:
      - cucikuy_network
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=cucikuy
      - DB_USERNAME=root
      - DB_PASSWORD=secret

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: cucikuy_scheduler
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    depends_on:
      - redis
      - mysql
    networks:
      - cucikuy_network
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=cucikuy
      - DB_USERNAME=root
      - DB_PASSWORD=secret

  mailhog:
    image: mailhog/mailhog
    container_name: cucikuy_mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - cucikuy_network

volumes:
  mysql_data:
  redis_data:

networks:
  cucikuy_network:
    driver: bridge